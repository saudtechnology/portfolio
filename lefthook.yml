# https://lefthook.dev/configuration/
min_version: 2.0.0

output:
  - meta
  - summary
  - failure
  - execution

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,yml,yaml,md,mdx,css}'
      exclude:
        - pnpm-lock.yaml
      run: pnpm exec prettier --check {staged_files}

    eslint:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      run: pnpm exec eslint {staged_files} --max-warnings 0 --no-warn-ignored

    json:
      glob: '*.json'
      run: pnpm exec eslint {staged_files} --max-warnings 0 --no-warn-ignored

    yaml:
      glob: '*.{yml,yaml}'
      exclude:
        - pnpm-lock.yaml
      run: pnpm exec eslint {staged_files} --max-warnings 0 --no-warn-ignored

    stylelint:
      glob: '*.{css,scss}'
      run: pnpm exec stylelint {staged_files}

    markdownlint:
      glob: '*.md'
      run: pnpm exec markdownlint --config .markdownlint.json --ignore-path .markdownlintignore {staged_files}

    toml:
      glob: '*.toml'
      run: pnpm exec taplo lint {staged_files}

    shellcheck:
      glob: '*.sh'
      run: command -v shellcheck >/dev/null && shellcheck --severity=warning {staged_files} || echo "shellcheck not installed"

    gitleaks:
      run: pnpm exec gitleaks-secret-scanner git --config=.gitleaks.toml --redact --verbose --exit-code=1

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    branch-name:
      run: pnpm lint:check:branchname

    prettier:
      run: pnpm lint:check:prettier

    eslint:
      run: pnpm eslint:check

    stylelint:
      run: pnpm lint:check:stylelint

    toml:
      run: pnpm lint:check:toml

    shell:
      run: pnpm lint:check:sh

    markdownlint:
      run: pnpm lint:check:markdown

    sast:
      run: pnpm test:sast:all

    unit:
      run: pnpm test:unit
