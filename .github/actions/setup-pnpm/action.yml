name: Setup pnpm
description: Node 24.14, Corepack pnpm 12.4.1, frozen install

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.14.0

    - name: Enable pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@12.4.1 --activate

    - name: Cache pnpm store
      uses: actions/setup-node@v4
      with:
        node-version: 24.14.0
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
