name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/reusable-ci.yml
    with:
      require_changeset: true
    permissions:
      contents: read
      pull-requests: read
